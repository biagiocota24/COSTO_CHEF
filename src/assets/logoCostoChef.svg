<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CostoChef" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Sfondo: quadrato scuro arrotondato -->
  <rect width="64" height="64" rx="14" fill="#231B16"/>
  <!-- Piatto / quadrante con apertura in alto -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#FFF4E6" stroke-width="4"
          stroke-linecap="round" stroke-dasharray="86.5 14" transform="rotate(295 32 32)"/>
  <!-- Lancetta: il "food cost" sotto controllo -->
  <line x1="32" y1="32" x2="26.5" y2="22.5" stroke="#FFF4E6" stroke-width="4" stroke-linecap="round"/>
  <!-- Perno centrale arancione -->
  <circle cx="32" cy="32" r="3.5" fill="#F0A868"/>
</svg>
